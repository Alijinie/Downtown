<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FourZ Kampala - Premium Botanicals & Market</title>
<meta name="description" content="Premium selection of botanical flowers and an open community marketplace.">
    
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background-color: #030d0a; -webkit-tap-highlight-color: transparent; }
.scrollbar-hide::-webkit-scrollbar { display: none; }
.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
.glass-panel { background: rgba(6, 22, 17, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129, 0.08); }
.fade-in { animation: fadeIn 0.4s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.animate-up { animation: slideUp 0.3s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
/* Loader */
.loader { border: 3px solid rgba(16, 185, 129, 0.2); border-bottom-color: #10b981; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
@keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body class="text-emerald-100 antialiased">
<div class="flex flex-col md:flex-row max-w-7xl mx-auto shadow-2xl overflow-hidden min-h-screen bg-[#030d0a]">
<aside class="hidden md:flex sticky top-0 h-screen w-[280px] bg-[#041410] border-r border-emerald-950/60 flex-col z-50 p-6">
<div class="flex items-center gap-3 mb-10">
<div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center shrink-0 shadow-lg shadow-emerald-900/30">
<i data-lucide="leaf" class="w-6 h-6 text-white"></i>
</div>
<div>
<h1 class="text-lg font-bold text-white tracking-tight leading-none">FourZ<br><span class="text-emerald-400 text-xs">Botanical Lounge</span></h1>
</div>
</div>
<nav class="space-y-2 flex-1">
<div class="text-[10px] uppercase font-bold tracking-wider text-emerald-800 mb-2 mt-4">Store</div>
<button onclick="switchTab('catalog')" id="tab-catalog" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium bg-emerald-600 text-white shadow-lg">
<i data-lucide="sparkles" class="w-5 h-5 text-emerald-200"></i> Premium Catalog
</button>
<div class="text-[10px] uppercase font-bold tracking-wider text-emerald-800 mb-2 mt-6">Community</div>
<button onclick="switchTab('market')" id="tab-market" class="nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium text-emerald-400 hover:bg-emerald-900/50 hover:text-white">
<i data-lucide="store" class="w-5 h-5"></i> Open Market
</button>
</nav>
</aside>

<div class="flex-1 h-screen overflow-y-auto pb-24 md:pb-0 scrollbar-hide relative">
<header class="sticky top-0 z-40 bg-[#030d0a]/95 backdrop-blur-md border-b border-emerald-950 p-4 flex justify-between items-center md:hidden">
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center shrink-0">
<i data-lucide="leaf" class="w-5 h-5 text-white"></i>
</div>
<span class="font-bold text-white text-base leading-tight">FourZ</span>
</div>
<div class="flex gap-2 bg-[#041410] rounded-lg p-1 border border-emerald-900/40">
<button onclick="switchTab('catalog')" id="mob-tab-catalog" class="px-3 py-1.5 text-xs font-bold rounded-md bg-emerald-600 text-white">Store</button>
<button onclick="switchTab('market')" id="mob-tab-market" class="px-3 py-1.5 text-xs font-bold rounded-md text-emerald-500 hover:text-white">Market</button>
</div>
</header>

<main class="p-4 md:p-8 max-w-5xl mx-auto">

<div id="view-catalog">
  <div class="rounded-3xl bg-gradient-to-r from-emerald-900 via-emerald-950 to-[#041410] p-6 md:p-10 mb-8 relative overflow-hidden shadow-2xl border border-emerald-800/20">
    <div class="absolute -top-10 -right-10 w-40 h-40 bg-emerald-500 opacity-20 rounded-full blur-3xl"></div>
    <div class="relative z-10">
      <span class="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-3 py-1 rounded-full mb-3 inline-block border border-emerald-500/30">PREMIUM & CURATED</span>
      <h2 class="text-2xl md:text-5xl font-bold text-emerald-400 mb-6 tracking-tight">Kampala's Finest <br>Botanical Treats.</h2>
    </div>
  </div>

  <div class="flex gap-3 overflow-x-auto pb-4 scrollbar-hide mb-4">
    <button onclick="filterCategory('all')" class="cat-pill whitespace-nowrap px-4 py-2 rounded-full bg-emerald-600 text-white text-xs font-bold border border-emerald-500 shadow-lg">All</button>
    <button onclick="filterCategory('Big Buds-New Arrivals')" class="cat-pill whitespace-nowrap px-4 py-2 rounded-full bg-[#0a2018] text-emerald-400 border border-emerald-900/60 text-xs font-semibold">New Arrivals</button>
    <button onclick="filterCategory('Edibles')" class="cat-pill whitespace-nowrap px-4 py-2 rounded-full bg-[#0a2018] text-emerald-400 border border-emerald-900/60 text-xs font-semibold">Edibles</button>
  </div>

  <div id="service-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-10"></div>
</div>

<div id="view-market" class="hidden">
  
  <div class="glass-panel p-5 md:p-8 rounded-3xl mb-8 border border-emerald-800/30">
    <div class="flex items-center gap-3 mb-6">
      <i data-lucide="upload-cloud" class="w-6 h-6 text-emerald-400"></i>
      <h2 class="text-xl md:text-2xl font-bold text-white tracking-tight">Sell on the Market</h2>
    </div>
    
    <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-emerald-400 mb-1">Product Name</label>
          <input type="text" id="m-name" required placeholder="e.g., Homemade Brownies" class="w-full bg-[#030d0a] border border-emerald-900/60 rounded-xl py-3 px-4 text-white placeholder-emerald-800 focus:outline-none focus:border-emerald-500 transition">
        </div>
        <div>
          <label class="block text-xs font-medium text-emerald-400 mb-1">Price (UGX)</label>
          <input type="text" id="m-price" required placeholder="e.g., 15k" class="w-full bg-[#030d0a] border border-emerald-900/60 rounded-xl py-3 px-4 text-white placeholder-emerald-800 focus:outline-none focus:border-emerald-500 transition">
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-emerald-400 mb-1">WhatsApp Number</label>
          <input type="text" id="m-phone" required placeholder="2567..." class="w-full bg-[#030d0a] border border-emerald-900/60 rounded-xl py-3 px-4 text-white placeholder-emerald-800 focus:outline-none focus:border-emerald-500 transition">
        </div>
        <div>
          <label class="block text-xs font-medium text-emerald-400 mb-1">Product Image</label>
          <input type="file" id="m-image" accept="image/*" required class="w-full bg-[#030d0a] border border-emerald-900/60 rounded-xl py-2.5 px-4 text-sm text-emerald-500 file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-900/50 file:text-emerald-300 hover:file:bg-emerald-800/50 cursor-pointer">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-emerald-400 mb-1">Short Description</label>
        <textarea id="m-desc" required placeholder="Tell buyers about this item..." rows="2" class="w-full bg-[#030d0a] border border-emerald-900/60 rounded-xl py-3 px-4 text-white placeholder-emerald-800 focus:outline-none focus:border-emerald-500 transition resize-none"></textarea>
      </div>
      <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-500 transition shadow-lg shadow-emerald-950/45 flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-5 h-5"></i> Post Listing
      </button>
    </form>
  </div>

  <h3 class="font-bold text-white mb-4 text-lg border-b border-emerald-950 pb-2">Community Listings</h3>
  <div id="market-feed" class="grid grid-cols-2 md:grid-cols-3 gap-4 pb-10">
     </div>

</div>
</main>
</div>
</div>

<div id="item-modal" class="hidden fixed inset-0 z-[100] flex items-end md:items-center justify-center px-0 md:px-4">
<div onclick="closeModal()" class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity"></div>
<div class="relative bg-[#061813] w-full max-w-md md:rounded-2xl rounded-t-2xl border border-emerald-900 shadow-2xl overflow-hidden transform transition-all flex flex-col animate-up max-h-[95vh] overflow-y-auto scrollbar-hide">
<button onclick="closeModal()" class="absolute top-4 right-4 z-20 bg-black/50 hover:bg-black/70 text-white p-2 rounded-full backdrop-blur-md">
<i data-lucide="x" class="w-5 h-5"></i>
</button>
<div id="modal-content" class="flex flex-col"></div>
</div>
</div>

<script>
// ==========================================
// 1. SUPABASE CONFIGURATION (UPDATE THESE!)
// ==========================================
const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ==========================================
// 2. UI NAVIGATION & TOGGLING
// ==========================================
function switchTab(tabName) {
  const catView = document.getElementById('view-catalog');
  const mktView = document.getElementById('view-market');
  
  // Desktop Nav
  const tabCat = document.getElementById('tab-catalog');
  const tabMkt = document.getElementById('tab-market');
  
  // Mobile Nav
  const mobCat = document.getElementById('mob-tab-catalog');
  const mobMkt = document.getElementById('mob-tab-market');

  if (tabName === 'catalog') {
    catView.classList.remove('hidden');
    mktView.classList.add('hidden');
    
    // Style active state (Desktop)
    tabCat.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium bg-emerald-600 text-white shadow-lg";
    tabMkt.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium text-emerald-400 hover:bg-emerald-900/50 hover:text-white";
    
    // Style active state (Mobile)
    mobCat.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-emerald-600 text-white";
    mobMkt.className = "px-3 py-1.5 text-xs font-bold rounded-md text-emerald-500 hover:text-white";
  } else {
    catView.classList.add('hidden');
    mktView.classList.remove('hidden');
    
    // Style active state (Desktop)
    tabMkt.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium bg-emerald-600 text-white shadow-lg";
    tabCat.className = "nav-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium text-emerald-400 hover:bg-emerald-900/50 hover:text-white";
    
    // Style active state (Mobile)
    mobMkt.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-emerald-600 text-white";
    mobCat.className = "px-3 py-1.5 text-xs font-bold rounded-md text-emerald-500 hover:text-white";
    
    // Fetch latest market items when opened
    fetchMarketItems();
  }
}

// ==========================================
// 3. CATALOG DATA (Existing FourZ Logic)
// ==========================================
const WHATSAPP_NUM = "256709207543";
const SERVICES = [
  { id: 1, name: 'Watermelon Zkittlez', category: 'Big Buds-New Arrivals', image: 'IMG-20260604-WA0002.jpg', price: '25k', desc: 'High potency indica providing head-rushing euphoria.' },
  { id: 23, name: 'Artisanal Gummies', category: 'Edibles', image: 'IMG-20260604-WA0015 (1).jpg', price: '10k', desc: 'Sweet, chewy fruit-flavored gummies infused with high-grade extracts.' }
];

function renderServices(items) {
  const container = document.getElementById('service-feed');
  container.innerHTML = items.map(item => `
    <div onclick="openModal('catalog', ${item.id})" class="glass-panel p-3 rounded-2xl flex items-center gap-4 hover:bg-[#061e18] transition group fade-in cursor-pointer">
      <div class="w-20 h-20 rounded-xl overflow-hidden shrink-0 border border-emerald-950">
        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
      </div>
      <div class="flex-1 min-w-0">
        <span class="text-[9px] font-bold text-emerald-400 tracking-wider uppercase">${item.category}</span>
        <h3 class="font-bold text-white text-sm truncate">${item.name}</h3>
        <span class="text-xs font-black text-emerald-300 mt-1 block">${item.price}</span>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

function filterCategory(category) {
  const filtered = category === 'all' ? SERVICES : SERVICES.filter(item => item.category === category);
  renderServices(filtered);
}

// ==========================================
// 4. MARKETPLACE LOGIC (Supabase)
// ==========================================
let marketItemsCache = [];

async function handleUpload(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.innerHTML = '<span class="loader w-5 h-5"></span> Uploading...';
  btn.disabled = true;

  try {
    const name = document.getElementById('m-name').value;
    const price = document.getElementById('m-price').value;
    const phone = document.getElementById('m-phone').value;
    const desc = document.getElementById('m-desc').value;
    const file = document.getElementById('m-image').files[0];

    // 1. Upload Image to Supabase Storage (Bucket: 'market_images')
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}-${Math.random()}.${fileExt}`;
    
    const { data: uploadData, error: uploadError } = await supabase.storage
      .from('market_images')
      .upload(fileName, file);

    if (uploadError) throw uploadError;

    // Get Public URL
    const { data: { publicUrl } } = supabase.storage
      .from('market_images')
      .getPublicUrl(fileName);

    // 2. Insert Record into Supabase DB (Table: 'products')
    const { error: dbError } = await supabase
      .from('products')
      .insert([{ name, price, phone, description: desc, image_url: publicUrl }]);

    if (dbError) throw dbError;

    // Reset Form & Refresh Feed
    document.getElementById('upload-form').reset();
    alert('Product listed successfully!');
    fetchMarketItems();

  } catch (error) {
    console.error("Upload Error:", error);
    alert('Failed to upload. Make sure your Supabase project is configured correctly.');
  } finally {
    btn.innerHTML = '<i data-lucide="plus" class="w-5 h-5"></i> Post Listing';
    btn.disabled = false;
    lucide.createIcons();
  }
}

async function fetchMarketItems() {
  const container = document.getElementById('market-feed');
  container.innerHTML = '<div class="col-span-full text-center py-8"><span class="loader w-8 h-8"></span></div>';

  try {
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;
    marketItemsCache = data || [];
    renderMarketItems(marketItemsCache);
  } catch (error) {
    console.error("Fetch Error:", error);
    container.innerHTML = '<div class="col-span-full text-center py-4 text-red-400">Could not load market items.</div>';
  }
}

function renderMarketItems(items) {
  const container = document.getElementById('market-feed');
  if (items.length === 0) {
    container.innerHTML = `<div class="col-span-full text-center py-10 text-emerald-700 text-sm">Be the first to list an item!</div>`;
    return;
  }

  container.innerHTML = items.map(item => `
    <div onclick="openModal('market', '${item.id}')" class="glass-panel rounded-2xl flex flex-col overflow-hidden cursor-pointer hover:border-emerald-500/30 transition fade-in">
      <div class="h-32 w-full bg-emerald-950 relative">
        <img src="${item.image_url}" alt="${item.name}" class="w-full h-full object-cover">
        <div class="absolute bottom-2 left-2 px-2 py-1 bg-[#030d0a]/80 backdrop-blur text-emerald-300 text-[10px] font-black rounded border border-emerald-900/60">${item.price}</div>
      </div>
      <div class="p-3">
        <h3 class="font-bold text-white text-xs truncate mb-1">${item.name}</h3>
        <p class="text-[9px] text-emerald-100/60 line-clamp-2">${item.description}</p>
      </div>
    </div>
  `).join('');
}

// ==========================================
// 5. MODAL LOGIC (Handles both Catalogs)
// ==========================================
function openModal(type, id) {
  const modal = document.getElementById('item-modal');
  const content = document.getElementById('modal-content');
  let item, targetPhone;

  if (type === 'catalog') {
    item = SERVICES.find(i => i.id === id);
    targetPhone = WHATSAPP_NUM;
  } else {
    item = marketItemsCache.find(i => i.id == id);
    targetPhone = item.phone.replace(/\D/g, ''); // strip non-numeric from uploader's phone
  }

  const imageSrc = type === 'catalog' ? item.image : item.image_url;
  const desc = type === 'catalog' ? item.desc : item.description;
  const msg = `Hello, I saw your listing for *${item.name}* (${item.price}) on the FourZ Market. Is this still available?`;
  const whatsappLink = `https://wa.me/${targetPhone}?text=${encodeURIComponent(msg)}`;

  content.innerHTML = `
    <div class="h-56 w-full relative">
      <img src="${imageSrc}" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-[#061813] to-transparent"></div>
    </div>
    <div class="p-6">
      <div class="text-center mb-4">
        <span class="inline-block px-2 py-1 mb-2 bg-emerald-900/50 text-emerald-300 text-[9px] uppercase font-bold rounded border border-emerald-800">
          ${type === 'catalog' ? 'Premium Store' : 'Community Market'}
        </span>
        <h2 class="text-2xl font-bold text-white mb-1">${item.name}</h2>
        <span class="text-emerald-400 font-bold text-lg">${item.price}</span>
      </div>
      
      <p class="text-emerald-100/70 text-sm mb-6 leading-relaxed text-center">${desc}</p>

      <div class="flex gap-3">
        <a href="${whatsappLink}" target="_blank" class="w-full py-3.5 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-500 transition shadow-lg flex items-center justify-center gap-2">
          <i data-lucide="message-circle" class="w-5 h-5"></i> Message Seller
        </a>
      </div>
    </div>
  `;

  lucide.createIcons();
  modal.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('item-modal').classList.add('hidden');
}

// Init
renderServices(SERVICES);
lucide.createIcons();
</script>
</body>
</html>
